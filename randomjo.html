<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>랜덤 그룹 나누기라능</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      padding: 20px;
      background-color: #f0f4f8;
    }
    textarea {
      width: 100%;
      height: 100px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    .group {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background-color: #ffffff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h2 {
      color: #333;
    }
  </style>
</head>
<body>
  <h1>랜덤으로 두 그룹을 나눠보이소</h1>
  <p>이름들을 줄바꿈(엔터)으로 입렭!하세요:</p>
  <textarea id="nameInput" placeholder="예: 철수&#10;영희&#10;민수..."></textarea>
  <br>
  <button onclick="divideGroups()">그룹 나누기</button>

  <div id="result"></div>

  <script>
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function divideGroups() {
      const input = document.getElementById("nameInput").value.trim();
      const names = input.split(/\s+/).filter(name => name.length > 0);
      
      if (names.length < 2) {
        alert("최소 2명 이상의 이름을 입력하세요.");
        return;
      }

      const shuffled = shuffle([...names]);
      const mid = Math.ceil(shuffled.length / 2);
      const group1 = shuffled.slice(0, mid);
      const group2 = shuffled.slice(mid);

      document.getElementById("result").innerHTML = `
        <div class="group">
          <h2>👥 그룹 1</h2>
          <p>${group1.join(', ')}</p>
        </div>
        <div class="group">
          <h2>👥 그룹 2</h2>
          <p>${group2.join(', ')}</p>
        </div>
      `;
    }
  </script>
</body>
</html>
